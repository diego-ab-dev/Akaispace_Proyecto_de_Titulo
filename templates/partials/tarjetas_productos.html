<!-- tarjetas de productos relacionados y recomendados (ficha y home, HU-07); recibe `productos` y `titulo`.
     Una recomendación registrada (KPI-05) trae url_recomendacion, que marca el clic antes de abrir la ficha -->
{% load custom_filters %}
<div class="container mt-5 pt-4 border-top">
    <h4 class="fw-bold mb-4 text-dark">{{ titulo }}</h4>

    <div class="row g-4">
        {% for rel in productos %}
        <div class="col-6 col-md-3">
            <a href="{% if rel.url_recomendacion %}{{ rel.url_recomendacion }}{% else %}{% url 'producto_detalle' rel.id %}{% endif %}"
               class="card-relacionada text-decoration-none">
                <div class="card-rel-img-wrapper">
                    {% if rel.imagen_principal %}
                        <img src="{{ rel.imagen_principal.url }}" alt="{{ rel.nombre }}">
                    {% else %}
                        <img src="https://via.placeholder.com/300" alt="Sin imagen">
                    {% endif %}
                </div>
                <div class="card-rel-body">
                    <h6 class="text-truncate fw-bold text-dark" title="{{ rel.nombre }}">{{ rel.nombre }}</h6>
                    <p class="text-muted small mb-1">{{ rel.categoria_texto }}</p>
                    <span class="fw-bold text-primary">${{ rel.precio|formato_chileno }}</span>
                </div>
            </a>
        </div>
        {% endfor %}
    </div>
</div>
