<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Datos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'styles/styles_editar_datos.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/sdgameslogo.png' %}">
</head>
<body>

    <div class="edit-container">
        <h2 class="form-title">Cambio de Datos Personales</h2>
        
        <form id="form-editar-perfil">
            <div class="mb-3">
				<label for="visiblePhone" class="form-label">Teléfono</label>
				<div class="input-group">
					<span class="input-group-text">+56 9</span>
					<input type="text" id="visiblePhone" class="form-control" 
						maxlength="8" oninput="syncPhone(this)" 
						placeholder="77889198"
						value="{{ usuario.telefono|slice:'6:' }}" required>
				</div>
				<input type="hidden" id="finalPhone" name="telefono" value="{{ usuario.telefono }}">
			</div>

            <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" id="direccion" name="direccion" class="form-control" value="{{ usuario.direccion }}">
            </div>

            <div class="mb-3">
                <label for="region" class="form-label">Región</label>
                <select id="region" name="region" class="form-select">
                    <option value="">Seleccione una región</option>
                    {% for region in regiones %}
                    <option value="{{ region }}" {% if region == usuario.region %}selected{% endif %}>
                        {{ region }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label for="ciudad" class="form-label">Ciudad</label>
                <select id="ciudad" name="ciudad" class="form-select">
                    {% for ciudad in ciudades %}
                    <option value="{{ ciudad }}" {% if ciudad == usuario.ciudad %}selected{% endif %}>
                        {{ ciudad }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="{% url 'perfil' %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // --- 1. Notificaciones ---
        function mostrarNotificacion(mensaje, tipo) {
            if (tipo === undefined) tipo = 'error';
            
            let alertDiv = document.getElementById('notificacion-registro');
            if (!alertDiv) {
                alertDiv = document.createElement('div');
                alertDiv.id = 'notificacion-registro';
                document.body.insertAdjacentElement('afterbegin', alertDiv);
            }
            
            const claseColor = tipo === 'success' ? 'alert-success' : 'alert-danger';
            const alertHTML = '<div class="alert ' + claseColor + ' alert-dismissible fade show position-fixed" role="alert" style="top: 20px; right: 20px; width: auto; max-width: 350px; z-index: 9999;">' +
                              mensaje +
                              '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                              '</div>';
            alertDiv.innerHTML = alertHTML;
            
            setTimeout(function() {
                const alert = alertDiv.querySelector('.alert');
                if (alert) alert.remove();
            }, 4000);
        }

        function limpiarNotificaciones() {
            const alertDiv = document.getElementById('notificacion-registro');
            if (alertDiv) alertDiv.innerHTML = '';
        }

        // --- 2. Lógica Teléfono ---
        function syncPhone(input) {
			// 1. Limpiar: dejar solo números
			let numeros = input.value.replace(/\D/g, '');
			
			// 2. Cortar: Si intenta escribir más de 8, lo cortamos
			if (numeros.length > 8) {
				numeros = numeros.slice(0, 8);
			}
			input.value = numeros;

			// 3. Actualizar Hidden: Se guarda como "+56 9 XXXXXXXX"
			const hiddenInput = document.getElementById('finalPhone');
			if (numeros.length > 0) {
				hiddenInput.value = "+56 9 " + numeros;
			} else {
				hiddenInput.value = "";
			}
		}

        // --- 3. Carga y Envío ---
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('form-editar-perfil');
            const regionSelect = document.getElementById('region');
            const ciudadSelect = document.getElementById('ciudad');

            // Cargar ciudades
            function cargarCiudades(region) {
                fetch(`/obtener_ciudades/?region=${region}`)
                    .then(response => response.json())
                    .then(data => {
                        ciudadSelect.innerHTML = '<option value="" disabled selected>Seleccione una ciudad</option>';
                        if (data.ciudades && data.ciudades.length > 0) {
                            ciudadSelect.disabled = false;
                            data.ciudades.forEach(function (ciudad) {
                                const option = document.createElement('option');
                                option.value = ciudad;
                                option.textContent = ciudad;
                                ciudadSelect.appendChild(option);
                            });
                        } else {
                            ciudadSelect.disabled = true;
                        }
                    })
                    .catch(error => console.log('Error al cargar ciudades:', error));
            }
            
            regionSelect.addEventListener('change', function () {
                cargarCiudades(this.value);
            });

            // Submit
            form.addEventListener('submit', function (event) {
                event.preventDefault();
                limpiarNotificaciones();
                
                let isValid = true;
                
                // Validar teléfono (Ajustado a 8 o 9 según tu preferencia, aquí puse min 8)
                const telefonoInput = document.getElementById('visiblePhone');
                const numeros = telefonoInput.value.replace(/\D/g, '');
                
                if (numeros.length < 8) {
                    isValid = false;
                    mostrarNotificacion("El teléfono debe tener al menos 8 números.");
                    telefonoInput.focus();
                    return;
                }

                if (!isValid) return;

                const formData = new FormData(form);

                fetch('{% url "editar" %}', { // Asegúrate que esta URL es correcta
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                        'X-CSRFToken': '{{ csrf_token }}'
                    }
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        mostrarNotificacion(data.success, 'success');
                        setTimeout(() => {
                            window.location.href = "{% url 'perfil' %}";
                        }, 2000);
                    } else {
                        mostrarNotificacion(data.error || "Error al actualizar los datos.");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    mostrarNotificacion("Error al procesar la solicitud.");
                });
            });
        });
    </script>
</body>
</html>
