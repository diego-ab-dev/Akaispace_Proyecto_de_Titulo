<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--CSS-->
    <link rel="stylesheet" href="{% static 'styles/styles_cambiarcont.css' %}">
    <!--LOGO-->
    <link rel="icon" type="image/png" href="{% static 'images/sdgameslogo.png' %}">
</head>
<body>

    <div id="notif-box" class="notif {{ request.GET.type }}">
        <span id="notif-msg">{{ request.GET.notif }}</span>
    </div>


    <div class="pass-card">
        <h2 class="form-title">Cambio de Contraseña</h2>
        
        <form id="cambiar-contraseña-form" method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="contraseña_actual" class="form-label">Contraseña Actual</label>
                <div class="position-relative">
                    <input id="contraseña_actual" type="password" name="contraseña_actual" class="form-control pe-5" required>
                    <button type="button" class="password-toggle-btn" id="toggleActual">
                        <i class="fas fa-eye" id="iconActual"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="nueva_contraseña" class="form-label">Nueva Contraseña</label>
                <div class="position-relative">
                    <input id="nueva_contraseña" type="password" name="nueva_contraseña" class="form-control pe-5" required>
                    <button type="button" class="password-toggle-btn" id="toggleNueva">
                        <i class="fas fa-eye" id="iconNueva"></i>
                    </button>
                </div>
            </div>

            <div class="mb-3">
                <label for="confirmar_contraseña" class="form-label">Confirmar Nueva Contraseña</label>
                <div class="position-relative">
                    <input id="confirmar_contraseña" type="password" name="confirmar_contraseña" class="form-control pe-5" required>
                    <button type="button" class="password-toggle-btn" id="toggleConfirmar">
                        <i class="fas fa-eye" id="iconConfirmar"></i>
                    </button>
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="{% url 'perfil' %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const notif = "{{ request.GET.notif|default:'' }}";

    if (notif.trim() !== "") {
        const box = document.getElementById("notif-box");
        box.classList.add("show");

        setTimeout(() => {
            box.classList.remove("show");
        }, 3500);
    }

    // ojo para ver la contra
    function configurarOjo(inputId, toggleId, iconId) {
        const input = document.getElementById(inputId);
        const btn = document.getElementById(toggleId);
        const icon = document.getElementById(iconId);

        if (!input || !btn || !icon) return;

        input.addEventListener('input', function() {
            btn.style.display = input.value.length > 0 ? 'block' : 'none';
        });

        btn.addEventListener('click', function() {
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            if (type === 'password') {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });
    }

    configurarOjo('contraseña_actual', 'toggleActual', 'iconActual');
    configurarOjo('nueva_contraseña', 'toggleNueva', 'iconNueva');
    configurarOjo('confirmar_contraseña', 'toggleConfirmar', 'iconConfirmar');
});
</script>
</body>
</html>
