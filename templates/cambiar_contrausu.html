<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!--CSS-->
    <link rel="stylesheet" href="{% static 'styles/styles_cambiarcont.css' %}">
    <!--LOGO-->
    <link rel="icon" type="image/png" href="{% static 'images/sdgameslogo.png' %}">
</head>
<body>

    <div class="pass-card">
        <h2 class="form-title">Cambio de Contraseña</h2>
        
        <form id="cambiar-contraseña-form" method="POST">
            {% csrf_token %}
            
            <div id="message-container"></div>
    
            <div class="mb-3">
                <label for="contraseña_actual" class="form-label">Contraseña Actual</label>
                <input id="contraseña_actual" type="password" name="contraseña_actual" class="form-control" required>
            </div>
    
            <div class="mb-3">
                <label for="nueva_contraseña" class="form-label">Nueva Contraseña</label>
                <input id="nueva_contraseña" type="password" name="nueva_contraseña" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="confirmar_contraseña" class="form-label">Confirmar Nueva Contraseña</label>
                <input id="confirmar_contraseña" type="password" name="confirmar_contraseña" class="form-control" required>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="{% url 'perfil' %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script type="application/json" id="django-messages">
        {{ mensajes_json|safe }}
    </script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const mensajesElement = document.getElementById('django-messages');
            if (mensajesElement && mensajesElement.textContent.trim()) {
                try {
                    const djangoMessages = JSON.parse(mensajesElement.textContent);
                    djangoMessages.forEach(message => {
                        const tipo = message.tipo === 'error' ? 'danger' : message.tipo;
                        mostrarMensaje(tipo, message.texto);
                    });
                } catch (e) {
                    console.error("Error parseando mensajes", e);
                }
            }
        });

        document.getElementById('cambiar-contraseña-form').addEventListener('submit', function (e) {
            const contraseñaActual = document.getElementById('contraseña_actual').value;
            const nuevaContraseña = document.getElementById('nueva_contraseña').value;
            const confirmarContraseña = document.getElementById('confirmar_contraseña').value;

            document.getElementById('message-container').innerHTML = '';

            if (!contraseñaActual) {
                e.preventDefault();
                mostrarMensaje('danger', 'Debe ingresar su contraseña actual.');
            } else if (nuevaContraseña !== confirmarContraseña) {
                e.preventDefault();
                mostrarMensaje('warning', 'Las contraseñas no coinciden.');
            }
        });

        // mostrar mensajes
        function mostrarMensaje(tipo, texto) {
            const contenedor = document.getElementById('message-container');

            const mensaje = document.createElement('div');
            mensaje.className = `alert alert-${tipo} alert-dismissible fade show`;
            mensaje.innerHTML = `${texto} <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;

            contenedor.appendChild(mensaje);

            setTimeout(() => {
                if(mensaje) mensaje.remove();
            }, 5000);
        }
    </script>
</body>
</html>
