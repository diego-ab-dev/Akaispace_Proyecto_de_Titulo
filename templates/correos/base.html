{% comment %}
Diseño común de los correos en HTML. Los estilos van en línea porque los clientes de correo
(Gmail, Outlook) ignoran las hojas de estilo externas y la mayoría de los <style>.
{% endcomment %}<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Akaispace</title>
</head>
<body style="margin:0; padding:0; background-color:#EEF1F4; font-family:Arial, Helvetica, sans-serif; color:#1C253B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF1F4; padding:24px 12px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px; background-color:#ffffff; border-radius:8px; overflow:hidden;">
        <tr>
          <td style="background-color:#1C253B; padding:20px 24px; color:#ffffff; font-size:22px; font-weight:bold; letter-spacing:2px;">
            AKAISPACE
          </td>
        </tr>
        <tr>
          <td style="padding:24px; font-size:15px; line-height:1.5;">
            {% block contenido %}{% endblock %}
          </td>
        </tr>
        <tr>
          <td style="background-color:#F5F7F9; padding:16px 24px; font-size:12px; color:#6B7280; line-height:1.5;">
            Akaispace · Galería Caupolicán 544, Local 26, Valdivia<br>
            Este correo se envió automáticamente, por favor no lo respondas.
            Si tienes dudas, escríbenos a akaispacevaldivia@gmail.com.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
