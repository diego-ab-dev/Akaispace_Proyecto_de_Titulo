<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--LOGO-->
    <link rel="icon" type="image/png" href="{% static 'images/akaispace_favicon.png' %}">
    <!--CSS-->
    <link rel="stylesheet" href="{% static 'styles/styles_ya_opinaste.css' %}">
    <title>Ya opinaste</title>
</head>
<body>
    <div class="message-card">
        <div class="icon-circle">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1>¡Ya opinaste!</h1>
        <p class="mb-1">Ya registramos tu valoración para el producto:</p>

        <div class="product-name-limit" title="{{ producto.nombre }}">
            "{{ producto.nombre }}"
        </div>

        <p class="mt-3">Solo puedes opinar una vez por producto.</p>
        
        <a href="javascript:history.back()" class="btn-volver">Volver atrás</a>
    </div>
</body>
</html>
