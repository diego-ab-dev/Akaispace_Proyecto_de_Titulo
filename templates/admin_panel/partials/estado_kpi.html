{% comment %}Estado de un KPI frente a su meta. Recibe `cumple` (True, False o None) y opcionalmente `sin_meta` (texto).{% endcomment %}{% if sin_meta %}<span class="estado"><i class='bx bx-time-five' aria-hidden="true"></i>{{ sin_meta }}</span>{% elif cumple is None %}<span class="estado"><i class='bx bx-minus-circle' aria-hidden="true"></i>Sin datos</span>{% elif cumple %}<span class="estado estado--bien"><i class='bx bx-check-circle' aria-hidden="true"></i>Cumple la meta</span>{% else %}<span class="estado estado--alerta"><i class='bx bx-error-circle' aria-hidden="true"></i>Bajo la meta</span>{% endif %}
