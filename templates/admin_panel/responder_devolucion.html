<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
    <title>Responder Reclamo</title>
    <link rel="stylesheet" href="{% static 'styles/styles_admin/styles_responder_devolucion.css' %}">
    <link rel="icon" type="image/png" href="{% static 'images/logoadmin.png' %}">
</head>
<body>
<div style="position: relative; max-width: 500px; width: 100%;">
        <h1 class="page-title">Responder Devolución</h1>
        
        <div class="response-card">
            
            <form method="post">
                {% csrf_token %}
                
                <div class="info-section">
                    <div><strong>Nombre Cliente:</strong> {{ devolucion.usuario.nombre }}</div>
                    <div><strong>Fecha:</strong> {{ devolucion.fecha_solicitud|date:"d/m/Y" }}</div>
                    
                    <div style="margin-top: 15px;"><strong>Motivo:</strong> 
                        <span class="motivo-text">
                            {{ devolucion.motivo }}
                        </span>
                    </div>
                </div>

                <hr style="opacity: 0.1; margin: 20px 0;">

                <textarea name="respuesta" rows="5" placeholder="Escribe tu respuesta aquí" required></textarea>

                <div class="mb-2" style="font-weight: 600; font-size: 0.95rem;">Selecciona una opción:</div>
                <div class="radio-group">
                    <label class="radio-option">
                        <input class="form-check-input" type="radio" name="accion" value="aceptar" required>
                        Aceptar
                    </label>
                    <label class="radio-option">
                        <input class="form-check-input" type="radio" name="accion" value="rechazar">
                        Rechazar
                    </label>
                </div>

                <div class="btn-row">
                    <button type="submit" class="btn-guardar">Guardar</button>
                    <a href="{% url 'admin_devoluciones' %}" class="btn-cancelar">Cancelar</a>
                </div>

            </form>

        </div>
    </div>
</body>
</html>
