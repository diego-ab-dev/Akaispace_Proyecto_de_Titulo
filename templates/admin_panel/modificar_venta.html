{% extends "base.html" %}
{% load static %}

{% block title %}Modificar Venta #{{ venta.id }}{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'styles/styles_admin/styles_modificar_venta.css' %}">
{% endblock %}

{% block content %}
    <div class="edit-container">

    <div style="position: absolute; top: 40px; width: 100%; text-align: center;">
        <h2 style="font-weight: 700; color: #000;">Modificar Venta #{{ venta.id }}</h2>
    </div>

    <div class="edit-card" style="margin-top: 60px;">
        {% if error %}
        <div class="alert alert-danger" style="font-weight:600; font-size:0.95rem;">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    {% with actual=estado_post|default:envio.estado %}
                        <option value="En Preparación" {% if actual == 'En Preparación' %}selected{% endif %}>En Preparación</option>
                        <option value="Enviado" {% if actual == 'Enviado' %}selected{% endif %}>Enviado</option>
                        <option value="En Tránsito" {% if actual == 'En Tránsito' %}selected{% endif %}>En Tránsito</option>
                        <option value="En Reparto" {% if actual == 'En Reparto' %}selected{% endif %}>En Reparto</option>
                        <option value="Entregado" {% if actual == 'Entregado' %}selected{% endif %}>Entregado</option>
                    {% endwith %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Transportista</label>
                <select name="transportista" class="form-select">
                    {% with actual_trans=transportista_post|default:envio.transportista|default:"Starken" %}
                        <option value="Starken" {% if actual_trans == 'Starken' %}selected{% endif %}>Starken</option>
                        <option value="Chilexpress" {% if actual_trans == 'Chilexpress' %}selected{% endif %}>Chilexpress</option>
                    {% endwith %}
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Número de Seguimiento</label>
                <input type="text" name="numero_seguimiento" class="form-control"
                    value="{{ tracking_post|default:envio.numero_seguimiento|default_if_none:'' }}"
                    placeholder="Ej: 001200442">
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="{% url 'detalle_venta' venta.id %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
