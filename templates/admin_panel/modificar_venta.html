<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
    <style>
    /* Estilos Específicos para replicar la imagen */
    .edit-container {
        background-color: #EEF1F4;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
    }

    .edit-card {
        background-color: white;
        border-radius: 10px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        padding: 40px;
        width: 100%;
        max-width: 500px;
        border: 1px solid #e0e0e0;
    }

    .form-title {
        text-align: center;
        font-weight: 700;
        font-size: 1.5rem;
        margin-bottom: 30px;
        color: #000;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-label {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 5px;
        color: #000;
    }

    .form-control, .form-select {
        border: 1px solid #e0e0e0;
        border-radius: 4px;
        padding: 10px;
        font-size: 0.95rem;
    }
    
    .form-control:focus, .form-select:focus {
        box-shadow: none;
        border-color: #4E84A8;
    }

    .btn-row {
        display: flex;
        gap: 15px;
        margin-top: 30px;
        justify-content: center;
    }

    .btn-guardar {
        background-color: #4E84A8; /* Azul */
        color: white;
        border: none;
        padding: 10px 40px;
        border-radius: 20px;
        font-weight: 700;
        width: 45%;
    }
    .btn-guardar:hover { background-color: #3b6a8a; color: white; }

    .btn-cancelar {
        background-color: #1C253B; /* Azul Oscuro/Negro */
        color: white;
        border: none;
        padding: 10px 40px;
        border-radius: 20px;
        font-weight: 700;
        text-decoration: none;
        text-align: center;
        width: 45%;
    }
    .btn-cancelar:hover { background-color: #111; color: white; }
</style>
</head>
<body>
    <div class="edit-container">
    
    <div style="position: absolute; top: 40px; width: 100%; text-align: center;">
        <h2 style="font-weight: 700; color: #000;">Modificar Venta #{{ venta.id }}</h2>
    </div>

    <div class="edit-card" style="margin-top: 60px;">
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Estado</label>
                <select name="estado" class="form-select">
                    <option value="En Preparación" {% if envio.estado == 'En Preparación' %}selected{% endif %}>En Preparación</option>
                    <option value="Enviado" {% if envio.estado == 'Enviado' %}selected{% endif %}>Enviado</option>
                    <option value="En Tránsito" {% if envio.estado == 'En Tránsito' %}selected{% endif %}>En Tránsito</option>
                    <option value="Entregado" {% if envio.estado == 'Entregado' %}selected{% endif %}>Entregado</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Número de Seguimiento</label>
                <input type="text" name="numero_seguimiento" class="form-control" 
                       value="{{ envio.numero_seguimiento|default:'' }}" placeholder="Ej: 001200442">
            </div>

            <div class="form-group">
                <label class="form-label">Teléfono</label>
                <input type="text" name="telefono" class="form-control" value="{{ venta.usuario.telefono }}">
            </div>

            <div class="form-group">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" class="form-control" value="{{ venta.usuario.direccion }}">
            </div>

            <div class="form-group">
                <label class="form-label">Región</label>
                <select name="region" id="region" class="form-select">
                    {% for region in regiones %}
                        <option value="{{ region }}" {% if venta.usuario.region == region %}selected{% endif %}>{{ region }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Ciudad</label>
                <select name="ciudad" id="ciudad" class="form-select">
                    <option value="{{ venta.usuario.ciudad }}">{{ venta.usuario.ciudad }}</option>
                    </select>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-guardar">Guardar</button>
                <a href="{% url 'detalle_venta' venta.id %}" class="btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script>
    const regionesCiudades = JSON.parse('{{ regiones_ciudades_json|escapejs }}');
    const regionSelect = document.getElementById('region');
    const ciudadSelect = document.getElementById('ciudad');

    regionSelect.addEventListener('change', function() {
        const region = this.value;
        const ciudades = regionesCiudades[region] || [];
        
        ciudadSelect.innerHTML = '';
        ciudades.forEach(ciudad => {
            const option = document.createElement('option');
            option.value = ciudad;
            option.textContent = ciudad;
            ciudadSelect.appendChild(option);
        });
    });
</script>
</body>
</html>
