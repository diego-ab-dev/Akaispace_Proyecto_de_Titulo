{% extends "base.html" %}
{% load static %}

{% block title %}Registro - Akaispace{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'styles/styles_register.css' %}">
{% endblock %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-start min-vh-100 pt-5 mt-4">
        <div class="row w-100">
            <div class="col-lg-10 col-xl-9 mx-auto">
                <div class="card flex-row border-0 shadow rounded-3 overflow-hidden">
                    <div class="card-img-left d-none d-md-flex text-center">
                        <h1 class="image-text">Akaispace</h1>
                    </div>

                    <div class="card-body p-4 p-sm-5" style="background-color: #fafafa;">
                        <h5 class="card-title text-center mb-5 fw-light fs-5 fw-bold">Registrarse</h5>
                        <form method="POST">
                            {% csrf_token %}
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="floatingRut" name="rut" 
                                    placeholder="12.345.678-9" 
                                    oninput="darFormatoRut(this)"
                                    required autofocus>
                                <label for="floatingRut">RUT</label>
                                <small class="text-muted">Formato: 12.345.678-9</small>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="floatingInputUsername" name="nombre"
                                    placeholder="myusername" maxlength="50" required>
                                <label for="floatingInputUsername">Nombre</label>
                                <div class="text-end">
                                    <small id="name-counter" class="text-muted" style="font-size: 0.75rem;">0/50</small>
                                </div>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="email" class="form-control" id="floatingInputEmail" name="email"
                                    placeholder="name@example.com" maxlength="254" required>
                                <label for="floatingInputEmail">Correo Electrónico</label>
                            </div>

                            <div class="input-group mb-3">
                                <span class="input-group-text">+56 9</span>
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="visiblePhone" 
                                        placeholder="12345678" maxlength="8" 
                                        oninput="syncPhone(this)" required>
                                    <label for="visiblePhone">Teléfono (8 dígitos)</label>
                                </div>
                                <input type="hidden" name="telefono" id="finalPhone">
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" id="region" name="region" required>
                                    <option value="" disabled selected>Seleccione una región</option>
                                    {% for region in regiones_ciudades.keys %}
                                    <option value="{{ region }}">{{ region }}</option>
                                    {% endfor %}
                                </select>
                                <label for="region">Región</label>
                            </div>

                            <div class="form-floating mb-3">
                                <select class="form-select" id="ciudad" name="ciudad" disabled required>
                                    <option value="" disabled selected>Seleccione una ciudad</option>
                                </select>
                                <label for="ciudad">Ciudad</label>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="floatingInputAdress" name="direccion"
                                    placeholder="Picarte 344" maxlength="100">
                                <label for="floatingInputAdress">Dirección</label>
                                <div class="text-end">
                                    <small id="address-counter" class="text-muted" style="font-size: 0.75rem;">0/100</small>
                                </div>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" class="form-control" id="floatingPassword" name="contraseña" placeholder="Password">
                                <label for="floatingPassword">Contraseña</label>

                                <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2 password-toggle-btn" 
                                        id="togglePassword" style="z-index: 10; border: none; background: transparent;">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </button>
                            </div>

                            <div class="form-floating mb-3 position-relative">
                                <input type="password" class="form-control" id="floatingPasswordConfirm" name="confirmar_contraseña" placeholder="Confirm Password">
                                <label for="floatingPasswordConfirm">Confirmar Contraseña</label>

                                <button type="button" class="btn btn-sm btn-outline-secondary position-absolute top-50 end-0 translate-middle-y me-2 password-toggle-btn" 
                                        id="toggleConfirmPassword" style="z-index: 10; border: none; background: transparent;">
                                    <i class="fas fa-eye" id="eyeIconConfirm"></i>
                                </button>
                            </div>

                            <div class="text-center">
                                <a class="small fw-bold" style="text-decoration: none; color:black;" href="/login">¿Ya tienes una cuenta? Inicia sesion aquí.</a>
                            </div>
                            <br>

                            <div class="d-grid mb-2">
                                <button class="btn btn-lg btn-login fw-bold text-uppercase" type="submit">
                                    Registrarse
                                </button>
                            </div>
                        </form>
                        <div class="text-center mt-4">
                            <a href="{% url 'home' %}" class="btn-volver btn btn-minimal">Volver</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>
    // notifiacion
    function mostrarNotificacion(mensaje, tipo) {
        if (tipo === undefined) tipo = 'error';

        let alertDiv = document.getElementById('notificacion-registro');
        if (!alertDiv) {
            alertDiv = document.createElement('div');
            alertDiv.id = 'notificacion-registro';
            document.body.insertAdjacentElement('afterbegin', alertDiv);
        }

        const claseColor = tipo === 'success' ? 'alert-success' : 'alert-danger';
        const alertHTML = '<div class="alert ' + claseColor + ' alert-dismissible fade show position-fixed" role="alert" style="top: 20px; right: 20px; width: auto; max-width: 350px; z-index: 9999;">' +
                          mensaje +
                          '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>' +
                          '</div>';
        alertDiv.innerHTML = alertHTML;

        setTimeout(function() {
            const alert = alertDiv.querySelector('.alert');
            if (alert) alert.remove();
        }, 4000);
    }

    // limpiar notificaciones
    function limpiarNotificaciones() {
        const alertDiv = document.getElementById('notificacion-registro');
        if (alertDiv) alertDiv.innerHTML = '';
    }

    // validacion de rut
    function validarRut(rutCompleto) {
        if (!rutCompleto) return false;

        let valor = rutCompleto.replace(/\./g, '').replace(/-/g, '');

        if (valor.length < 8) return false;

        let cuerpo = valor.slice(0, -1);
        let dv = valor.slice(-1).toUpperCase();

        if (!/^\d+$/.test(cuerpo)) return false;

        let suma = 0;
        let multiplo = 2;

        for (let i = 1; i <= cuerpo.length; i++) {
            let index = multiplo * valor.charAt(cuerpo.length - i);
            suma = suma + index;
            if (multiplo < 7) { multiplo = multiplo + 1; } else { multiplo = 2; }
        }

        let dvEsperado = 11 - (suma % 11);
        dvEsperado = (dvEsperado == 11) ? '0' : (dvEsperado == 10) ? 'K' : dvEsperado.toString();

        return dv === dvEsperado;
    }

    // validacion de celular
    function syncPhone(input) {
        let numeros = input.value.replace(/\D/g, '');

        if (numeros.length > 8) {
            numeros = numeros.slice(0, 8);
        }
        input.value = numeros;

        const hiddenInput = document.getElementById('finalPhone');
        if (numeros.length > 0) {
            hiddenInput.value = "+56 9 " + numeros;
        } else {
            hiddenInput.value = "";
        }
    }

    // formato para rut
    function darFormatoRut(rutInput) {
        let valor = rutInput.value.replace(/[^0-9kK]/g, '').toUpperCase();

        if (valor.length > 9) {
            valor = valor.slice(0, 9);
        }

        if (valor.length === 0) {
            rutInput.value = "";
            return;
        }

        let cuerpo = valor.slice(0, -1);
        let dv = valor.slice(-1);

        rutInput.value = cuerpo + (cuerpo.length > 0 ? "-" + dv : dv);

        if (cuerpo.length > 3) {
            let cuerpoFormateado = "";
            for (let i = cuerpo.length - 1, j = 1; i >= 0; i--, j++) {
                cuerpoFormateado = cuerpo.charAt(i) + cuerpoFormateado;
                if (j % 3 === 0 && i !== 0) {
                    cuerpoFormateado = "." + cuerpoFormateado;
                }
            }
            rutInput.value = cuerpoFormateado + "-" + dv;
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const form = document.querySelector('form');
        const regionSelect = document.getElementById('region');
        const ciudadSelect = document.getElementById('ciudad');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            limpiarNotificaciones();

            let isValid = true;

            // validar nombre
            const nombre = document.getElementById('floatingInputUsername');
            const nombreRegex = /^[a-zA-Z\s]+$/;
            if (!nombreRegex.test(nombre.value.trim())) {
                isValid = false;
                mostrarNotificacion("El nombre solo debe contener letras.");
                nombre.focus();
                return;
            }

            // validar RUT
            const rutInput = document.getElementById('floatingRut');
            if (!validarRut(rutInput.value)) {
                isValid = false;
                mostrarNotificacion("El RUT ingresado no es válido.");
                rutInput.focus();
                return;
            }

            // validar email
            const email = document.getElementById('floatingInputEmail');
            if (!email.value.includes('@')) {
                isValid = false;
                mostrarNotificacion("El correo debe contener un '@'.");
                email.focus();
                return;
            }

            // validar teléfono
            const telefonoInput = document.getElementById('visiblePhone');
            const telefonoRegex = /^\d{8}$/;
            if (!telefonoRegex.test(telefonoInput.value.trim())) {
                isValid = false;
                mostrarNotificacion("El teléfono debe tener 8 números.");
                telefonoInput.focus();
                return;
            }

            // validar contraseñas
            const contraseña = document.getElementById('floatingPassword');
            const confirmarContraseña = document.getElementById('floatingPasswordConfirm');
            if (contraseña.value !== confirmarContraseña.value) {
                isValid = false;
                mostrarNotificacion("Las contraseñas no coinciden.");
                confirmarContraseña.focus();
                return;
            }

            if (!isValid) return;

            // enviar formulario
            const formData = new FormData(form);

            fetch(form.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        mostrarNotificacion(data.message || "¡Registro exitoso!", 'success');
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 2000);
                    } else {
                        mostrarNotificacion(data.message || "Error en el registro.");
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    mostrarNotificacion("Error al procesar el registro.");
                });
        });

        // cargar ciudades
        function cargarCiudades(region) {
            fetch(`/obtener_ciudades/?region=${region}`)
                .then(response => response.json())
                .then(data => {
                    ciudadSelect.innerHTML = '<option value="" disabled selected>Seleccione una ciudad</option>';
                    if (data.ciudades && data.ciudades.length > 0) {
                        ciudadSelect.disabled = false;
                        data.ciudades.forEach(function (ciudad) {
                            const option = document.createElement('option');
                            option.value = ciudad;
                            option.textContent = ciudad;
                            ciudadSelect.appendChild(option);
                        });
                    } else {
                        ciudadSelect.disabled = true;
                    }
                })
                .catch(error => console.log('Error al cargar ciudades:', error));
        }

        regionSelect.addEventListener('change', function () {
            cargarCiudades(this.value);
        });
    });

    // ojo para ver la contra
    function configurarOjo(inputId, toggleId, iconId) {
        const passwordInput = document.getElementById(inputId);
        const toggleButton = document.getElementById(toggleId);
        const eyeIcon = document.getElementById(iconId);

        if (!passwordInput || !toggleButton || !eyeIcon) return;

        toggleButton.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);

            if (type === 'password') {
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            } else {
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            }
        });

        passwordInput.addEventListener('input', function () {
            if (passwordInput.value.length > 0) {
                toggleButton.style.display = 'block';
            } else {
                toggleButton.style.display = 'none';
            }
        });

        toggleButton.style.display = 'none';
    }

    configurarOjo('floatingPassword', 'togglePassword', 'eyeIcon');
    configurarOjo('floatingPasswordConfirm', 'toggleConfirmPassword', 'eyeIconConfirm');

    function configurarContador(inputId, counterId, maxLength) {
        const input = document.getElementById(inputId);
        const counter = document.getElementById(counterId);

        if (!input || !counter) return;

        const updateCounter = () => {
            const currentLength = input.value.length;
            counter.textContent = `${currentLength}/${maxLength}`;

            if (currentLength >= maxLength) {
                counter.classList.add('text-danger');
                counter.classList.remove('text-muted');
            } else {
                counter.classList.remove('text-danger');
                counter.classList.add('text-muted');
            }
        };

        input.addEventListener('input', updateCounter);
        updateCounter();
    }

    document.addEventListener('DOMContentLoaded', function() {
        configurarContador('floatingInputUsername', 'name-counter', 50);
        configurarContador('floatingInputAdress', 'address-counter', 100);
});
</script>
{% endblock %}
