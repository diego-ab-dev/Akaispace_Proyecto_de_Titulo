{% extends "base.html" %}
{% load static %}

{% block title %}Recuperar contraseña - Akai Space{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'styles/styles_login.css' %}">
{% endblock %}

{% block content %}
<div class="container-fluid ps-md-0">
  <div class="row g-0">
    <div class="d-none d-md-flex col-md-4 col-lg-6 bg-image">
      <div class="marca-login">
        <a href="{% url 'home' %}" class="logo-inicio" title="Ir al inicio"><img src="{% static 'images/akaispace_logo.webp' %}" alt="Akai Space"></a>
        <p>Tu próxima partida empieza aquí</p>
      </div>
    </div>
    <div class="col-md-8 col-lg-6">
      <div class="login d-flex align-items-center py-5">
        <div class="container">
          <div class="row">
            <div class="col-md-9 col-lg-8 mx-auto">
              <a href="{% url 'home' %}" class="logo-inicio d-md-none" title="Ir al inicio"><img src="{% static 'images/akaispace_logo.webp' %}" alt="Logo Akai Space" style="width: 110px; display: block; margin-bottom: 1rem;"></a>
              {% block tarjeta %}{% endblock %}
              <div class="text-center mt-4">
                <a href="{% url 'login' %}" class="btn-volver btn">Volver al inicio de sesión</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
