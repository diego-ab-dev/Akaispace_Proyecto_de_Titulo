<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Opinión - {{ producto.nombre }}</title>
    <!--Boostrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!--CSS-->
    <link rel="stylesheet" href="{% static 'styles/styles_enviar_opinion.css' %}">
    <!--LOGO-->
    <link rel="icon" type="image/png" href="{% static 'images/akaispace_favicon.png' %}">
</head>
<body>
    <div class="opinion-card">
        <h1 title="Tu opinión de {{ producto.nombre }}">
            Tu opinión de "{{ producto.nombre }}"
        </h1>
        <!--Formulario-->
        <form method="post" id="opinionForm">
            {% csrf_token %}
            <label class="rating-label">Puntuación</label>
            <div class="star-container" id="starContainer">
                <i class="fa-solid fa-star star-icon" data-value="1"></i>
                <i class="fa-solid fa-star star-icon" data-value="2"></i>
                <i class="fa-solid fa-star star-icon" data-value="3"></i>
                <i class="fa-solid fa-star star-icon" data-value="4"></i>
                <i class="fa-solid fa-star star-icon" data-value="5"></i>
            </div>
            
            <input type="number" name="puntuacion" id="ratingValue" class="hidden-rating-input" required value="5">

            <label class="comment-label">Comentario</label>
            <textarea name="comentario" class="custom-textarea" placeholder="Escribe aquí tu comentario" required></textarea>

            <div class="actions-row">
                <button type="submit" class="btn-custom btn-submit">Enviar</button>
                
                <a href="javascript:history.back()" class="btn-custom btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>

<script>
    const stars = document.querySelectorAll('.star-icon');
    const ratingInput = document.getElementById('ratingValue');

    // funcion para pintar las estrellas
    function highlightStars(value) {
        stars.forEach(star => {
            const starValue = parseInt(star.getAttribute('data-value'));
            if (starValue <= value) {
                star.classList.add('active');
            } else {
                star.classList.remove('active');
            }
        });
    }

    highlightStars(5);

    stars.forEach(star => {
        star.addEventListener('click', () => {
            const value = parseInt(star.getAttribute('data-value'));
            ratingInput.value = value; 
            highlightStars(value); 
        });
    });
</script>
</body>
</html>
