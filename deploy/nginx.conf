server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    client_max_body_size 10m;

    # IP real del cliente (django-axes y registros): la última de X-Forwarded-For, que agrega el
    # balanceador. Solo se acepta si la conexión viene de la VPC, así nadie la falsifica desde afuera.
    set_real_ip_from 10.0.0.0/16;
    real_ip_header X-Forwarded-For;

    # El balanceador consulta con la IP como Host; se fija uno permitido
    location = /health/ {
        proxy_pass http://web:8000;
        proxy_set_header Host localhost;
    }

    location /static/ {
        alias /usr/share/nginx/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
